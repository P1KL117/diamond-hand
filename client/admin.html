<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diamond Hand — Admin</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="daily.css">
</head>
<body>
<div id="app">
  <div style="max-width:440px;margin:40px auto;padding:0 20px;display:flex;flex-direction:column;gap:16px">
    <h1 class="home-title" style="font-size:2rem">ADMIN</h1>
    <p class="mode-desc" style="text-align:left">
      Reset the daily leaderboard. This wipes scores and frees everyone to
      resubmit their initials. Only works with the correct secret
      (the <code>ADMIN_SECRET</code> you set in Railway).
    </p>

    <label class="mode-label" style="text-align:left;width:auto">SECRET</label>
    <input id="secret" type="password" class="date-picker" style="width:100%" placeholder="your ADMIN_SECRET" autocomplete="off">

    <label class="mode-label" style="text-align:left;width:auto">SCOPE (optional)</label>
    <input id="date" class="date-picker" style="width:100%" placeholder="date YYYY-MM-DD (blank = all days)">
    <select id="style" class="sort-select">
      <option value="">all styles</option>
      <option value="normal">normal</option>
      <option value="blind">blind</option>
      <option value="shuffled">shuffled</option>
    </select>

    <button id="reset-btn" class="btn-primary" style="margin-top:6px">Reset Leaderboard</button>
    <div id="result" class="mode-desc" style="text-align:left;min-height:2em"></div>
  </div>
</div>
<script>
document.getElementById('reset-btn').addEventListener('click', async () => {
  const secret = document.getElementById('secret').value.trim();
  const date = document.getElementById('date').value.trim();
  const style = document.getElementById('style').value;
  const out = document.getElementById('result');
  if (!secret) { out.textContent = 'Enter the secret first.'; return; }
  if (!confirm('Really reset the leaderboard' + (date ? ' for ' + date : ' (ALL days)') + '?')) return;
  out.textContent = 'Resetting…';
  const body = {};
  if (date) body.date = date;
  if (style) body.style = style;
  try {
    const res = await fetch('/api/admin/reset?secret=' + encodeURIComponent(secret), {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
    });
    const data = await res.json();
    if (res.ok && data.ok) out.textContent = `✓ Reset done (scope: ${data.scope}). Everyone can submit again.`;
    else out.textContent = `✗ Failed: ${data.error || res.status}. Check the secret.`;
  } catch (e) { out.textContent = '✗ Error: ' + e.message; }
});
</script>
</body>
</html>
